
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Набор администрации — FLASH RUSSIA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1018;color:#f5f5f5;font-family:Arial,sans-serif;padding:18px}
main{max-width:560px;margin:20px auto;background:#191e2b;padding:24px;border-radius:18px;border:1px solid #343b4d}
.logo{text-align:center;color:#ffb52e;font-size:30px;font-weight:900;letter-spacing:2px}
h1{text-align:center;font-size:23px}
.desc{text-align:center;color:#b9c0d0;line-height:1.5}
label{display:block;margin-top:17px;font-size:14px;font-weight:bold}
input,select,textarea{display:block;width:100%;margin-top:8px;padding:13px;border-radius:9px;border:1px solid #414a60;background:#10141e;color:white;font-size:16px}
textarea{resize:vertical}
button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:10px;background:#ffb52e;color:#171717;font-weight:bold;font-size:16px}
button:disabled{opacity:.6}
#result{margin-top:16px;text-align:center;line-height:1.5}
footer{text-align:center;color:#858da0;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="logo">FLASH RUSSIA</div>
<h1>Заявка в администрацию</h1>
<p class="desc">Заполни анкету внимательно. Все поля обязательны.</p>

<form id="application">
<label>Игровой никнейм
<input name="nickname" required maxlength="60" placeholder="Например, Ivan_Ivanov">
</label>

<label>Возраст
<input name="age" type="number" min="13" max="99" required>
</label>

<label>Telegram для связи
<input name="telegram" required maxlength="80" placeholder="@username">
</label>

<label>Уровень на сервере
<input name="level" required maxlength="30" placeholder="Твой уровень">
</label>

<label>Желаемая должность
<select name="role" required>
<option value="">Выбери должность</option>
<option>Младший администратор</option>
<option>Администратор</option>
<option>Старший администратор</option>
<option>Модератор</option>
<option>Помощник администратора</option>
</select>
</label>

<label>Есть ли опыт администрирования?
<textarea name="experience" rows="3" required maxlength="1000"></textarea>
</label>

<label>Почему хочешь стать администратором?
<textarea name="reason" rows="4" required maxlength="1500"></textarea>
</label>

<label>Сколько времени в день готов уделять проекту?
<input name="online" required maxlength="100" placeholder="Например, 3–4 часа">
</label>

<label>Как будешь решать конфликты с игроками?
<textarea name="conflicts" rows="3" required maxlength="1000"></textarea>
</label>

<button id="send" type="submit">ОТПРАВИТЬ ЗАЯВКУ</button>
<div id="result" role="status"></div>
</form>
<footer>FLASH RUSSIA · Набор администрации</footer>
</main>

<script>
const API = "https://flash-russia-server.kopiya023.workers.dev/api/applications";
const form = document.getElementById("application");
const button = document.getElementById("send");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  result.textContent = "Отправляем заявку...";

  const data = Object.fromEntries(new FormData(form).entries());
  data.application_id = "FR-" + Date.now();

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });

    const answer = await response.json();

    if (!response.ok) {
      throw new Error(answer.error || "Ошибка отправки");
    }

    result.textContent = "Заявка отправлена! Спасибо за участие в наборе.";
    form.reset();
  } catch (error) {
    result.textContent = "Не удалось отправить заявку. Сообщи администрации проекта.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
